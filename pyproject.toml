[project]
name = "ai-powered-risk-assessment-agent"
version = "0.2.0"
description = "Streamlit app that performs GenAI project risk assessments with Google Gemini."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.23,<3",
    "streamlit>=1.48,<2",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 is not enforced: the UI and prompt modules carry long strings where
# wrapping would hurt readability more than it helps.
ignore = ["E501"]

[tool.pytest.ini_options]
# pythonpath lets tests import back_end and front_end without a src layout or
# an editable install.
pythonpath = ["."]
